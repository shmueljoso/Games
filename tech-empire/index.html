<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080B14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אימפריית טק">
<meta name="description" content="סימולציית תעשיית הטכנולוגיה בעברית: נהלו את אפל, סמסונג, גוגל או שיאומי — או בנו ערוץ ביקורות. שרשרת אספקה, קווי ייצור, מלאי מת, ציפיות דירקטוריון ואלגוריתם שמשנה את הכללים.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>אימפריית טק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Heebo:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ boot / company picker ═══════════════════════════════════════════ -->
<div id="boot" class="boot">
  <div class="boot-scroll">
    <header class="boot-head">
      <div class="logo" aria-hidden="true">TE</div>
      <h1>אימפריית טק</h1>
      <p class="boot-sub">התעשייה לא מחכה לאף אחד. בחרו כיסא, ותתחילו לספור חודשים.</p>
    </header>

    <div class="seg" role="tablist" aria-label="בחירת מצב משחק">
      <button class="seg-btn is-on" role="tab" aria-selected="true" data-mode="ceo">מצב מנכ״ל</button>
      <button class="seg-btn" role="tab" aria-selected="false" data-mode="creator">מצב יוצר תוכן</button>
    </div>

    <section id="pickCeo" class="pick">
      <h2 class="sec-title">מי אתם מנהלים?</h2>
      <div id="coList" class="co-list"></div>
    </section>

    <section id="pickCreator" class="pick" hidden>
      <h2 class="sec-title">מי אתם מול המצלמה?</h2>
      <div id="crList" class="co-list"></div>
    </section>

    <div class="boot-foot">
      <label class="field">
        <span class="field-lab">זרע אקראיות (אופציונלי)</span>
        <input id="seedIn" type="text" inputmode="text" placeholder="השאירו ריק לעולם חדש" autocomplete="off">
      </label>
      <button id="startBtn" class="btn btn-primary btn-lg" disabled>בחרו כיסא כדי להתחיל</button>
      <button id="resumeBtn" class="btn btn-ghost" hidden>המשך משחק שמור</button>
    </div>
  </div>
</div>

<!-- ═══ game shell ══════════════════════════════════════════════════════ -->
<div id="shell" class="shell" hidden>

  <header class="topbar">
    <div class="topbar-row">
      <div class="tb-id">
        <span id="tbBadge" class="tb-badge">A</span>
        <span class="tb-names">
          <strong id="tbName">—</strong>
          <small id="tbDate">—</small>
        </span>
      </div>
      <div class="tb-stats" id="tbStats"></div>
      <button id="menuBtn" class="icon-btn" aria-label="תפריט">☰</button>
    </div>
    <div class="tb-progress"><i id="tbProg"></i></div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div id="view" class="view"></div>
  </main>

  <nav class="bottombar" aria-label="ניווט ראשי">
    <div class="bb-action">
      <button id="nextBtn" class="btn btn-primary btn-next">
        <span class="next-lab">סיום החודש</span>
        <span id="nextSub" class="next-sub num">—</span>
      </button>
    </div>
    <div class="bb-tabs" id="tabs" role="tablist"></div>
  </nav>
</div>

<!-- ═══ bottom sheet ════════════════════════════════════════════════════ -->
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">—</h2>
    <button id="sheetClose" class="icon-btn" aria-label="סגירה">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
  <div id="sheetFoot" class="sheet-foot" hidden></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
