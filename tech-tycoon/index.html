<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מסלול הברזל">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>מסלול הברזל</title>
<meta name="description" content="סימולציית קריירה בתעשיית הטכנולוגיה: נהלו חברה, השקיעו במו״פ, גייסו טאלנטים, רכשו סטארטאפים והחליטו מתי לשבור את הפרדיגמה. העולם מגיב להשקעות, לא לשעון.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Heebo:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ═══════════ tokens ═══════════ */
:root{
  --ground:#0A0C12; --sunk:#070911;
  --panel:#141824; --panel-2:#1A2030; --raise:#222941;
  --line:#252C40; --line-soft:#1C2233;
  --ink:#E9ECF6; --ink-2:#98A2BD; --ink-3:#69738F;
  --accent:#FF7A45;        /* אנחנו */
  --accent-2:#FFA173;
  --accent-glow:rgba(255,122,69,.14);
  --cyan:#3ED9E8;          /* השוק והמתחרים */
  --violet:#8B7BFF;        /* טכנולוגיה ופרדיגמות */
  --good:#3FCF8E; --bad:#F2545B; --warn:#F0B429;
  --r:12px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --body:'Assistant',system-ui,'Segoe UI',sans-serif;
  --display:'Heebo','Assistant',system-ui,sans-serif;
  --shadow:0 20px 44px -26px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:3px 3px;background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-3)}
.mut{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══════════ command bar ═══════════ */
.bar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,12,18,.99),rgba(10,12,18,.94));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 20px}
.bar::after{content:'';position:absolute;bottom:-1px;right:0;height:2px;width:var(--yr,0%);
  background:linear-gradient(90deg,transparent,var(--accent));transition:width .5s ease;border-radius:2px}
.bar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1560px;margin:0 auto}
.who{display:flex;align-items:center;gap:10px;min-width:190px}
.who .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);
  font-weight:900;font-size:15px;color:var(--accent);border:1px solid rgba(255,122,69,.34);
  background:linear-gradient(150deg,rgba(255,122,69,.24),rgba(255,122,69,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.who b{display:block;font-family:var(--display);font-size:15px;line-height:1.15}
.who span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.09em}
.stats{display:flex;flex:1;gap:0;flex-wrap:wrap}
.stat{padding:1px 15px;border-right:1px solid var(--line-soft);min-width:92px}
.stat:first-child{border-right:0}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.stat b{display:block;font-family:var(--mono);font-size:15.5px;font-weight:700;letter-spacing:-.04em}
.turn{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#170A03;border-radius:10px;
  padding:10px 22px;font-weight:700;font-size:15px;letter-spacing:-.01em;
  box-shadow:0 10px 28px -14px var(--accent),inset 0 1px 0 rgba(255,255,255,.28);
  transition:filter .12s,transform .1s}
.turn:hover{filter:brightness(1.09)} .turn:active{transform:translateY(1px)}
.turn[disabled]{opacity:.4;cursor:not-allowed}
.turn.ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px}
.turn.ghost:hover{color:var(--ink)}

/* ═══════════ layout ═══════════ */
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 80px}
main{scroll-margin-top:78px}
.shell{display:grid;grid-template-columns:206px minmax(0,1fr);gap:18px;align-items:start}
nav.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:1px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:9px 12px;border-radius:9px;
  color:var(--ink-2);font-weight:600;font-size:14.5px;transition:background .12s,color .12s}
.rail button:hover{background:var(--panel)}
.rail button.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.rail button .ic{width:16px;height:16px;flex:none;opacity:.85}
.rail button em{margin-inline-start:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;
  background:var(--accent);color:#170A03;border-radius:99px;padding:0 6px;font-weight:700}
.rail .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);padding:14px 12px 5px;text-transform:uppercase}

.cols{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1240px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c21,.c12{grid-template-columns:1fr}}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .rail button{width:auto;white-space:nowrap}.rail .grp,.rail .ic{display:none}
  .c2,.c3,.c4{grid-template-columns:1fr}
}

/* ═══════════ cards ═══════════ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.card+.card{margin-top:16px}
.card>header{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--line-soft)}
.card>header h2{font-size:16.5px}
.card>header p{margin:0;font-size:12.5px;color:var(--ink-3)}
.card>header .right{margin-inline-start:auto}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:9px;width:100%}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}
.tile{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;min-width:0;overflow-wrap:anywhere}
.tile i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.tile b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.05em;margin-top:1px;
  font-variant-numeric:tabular-nums}
.tile i{font-weight:600}
.tile.hi::after{content:'';position:absolute;inset:auto auto 0 0;width:34px;height:2px;background:var(--accent);opacity:.5}
.tile{position:relative;overflow:hidden}
.tile small{color:var(--ink-3);font-size:11.5px;display:block;margin-top:1px}
.tile.hi{border-color:rgba(255,122,69,.32);background:linear-gradient(160deg,var(--accent-glow),var(--panel-2) 62%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile{transition:border-color .14s}
.card{position:relative}

/* meters */
.meter{height:5px;background:var(--raise);border-radius:99px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.meter.v>span{background:var(--violet)} .meter.c>span{background:var(--cyan)}
.meter.g>span{background:var(--good)} .meter.w>span{background:var(--warn)} .meter.b>span{background:var(--bad)}
.meter.tall{height:8px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-family:var(--mono);
  font-size:11px;font-weight:700;white-space:nowrap}
.p-good{background:rgba(63,207,142,.14);color:var(--good)}
.p-warn{background:rgba(240,180,41,.14);color:var(--warn)}
.p-bad{background:rgba(242,84,91,.15);color:var(--bad)}
.p-acc{background:var(--accent-glow);color:var(--accent)}
.p-cy{background:rgba(62,217,232,.12);color:var(--cyan)}
.p-vi{background:rgba(139,123,255,.14);color:var(--violet)}
.p-mut{background:var(--raise);color:var(--ink-3)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
.scroll{overflow-x:auto;max-width:100%}
th{text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover{background:var(--panel-2)}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:left;letter-spacing:-.04em;white-space:nowrap}
tr.me td{background:rgba(255,122,69,.06)}
tr.me td:first-child{box-shadow:inset -2px 0 0 var(--accent)}

/* controls */
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent);background:var(--raise)}
.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#170A03;border-color:transparent;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:7px}
.btn.bad{color:var(--bad);border-color:rgba(242,84,91,.35)}
.btn.bad:hover{border-color:var(--bad);background:rgba(242,84,91,.1)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line);background:var(--panel-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
select,input[type=text],input[type=number]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=range]{width:100%;background:transparent;-webkit-appearance:none;appearance:none;height:18px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--raise);border-radius:99px}
input[type=range]::-moz-range-track{height:4px;background:var(--raise);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:99px;background:var(--accent);border:2px solid var(--panel);cursor:grab}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:99px;background:var(--accent);border:2px solid var(--panel);cursor:grab}
input[type=checkbox]{accent-color:var(--accent)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

/* feed */
.feed{display:flex;flex-direction:column;gap:0;max-height:420px;overflow-y:auto}
.feed .it{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;align-items:flex-start}
.feed time{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;padding-top:3px;min-width:48px}
.dot{width:6px;height:6px;border-radius:99px;flex:none;margin-top:6px;background:var(--ink-3)}
.dot.g{background:var(--good)}.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}
.dot.i{background:var(--cyan)}.dot.a{background:var(--accent)}.dot.v{background:var(--violet)}

/* ticker */
.ticker{position:fixed;bottom:0;right:0;left:0;z-index:55;height:36px;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(10,12,18,.86),var(--sunk));border-top:1px solid var(--line);
  cursor:pointer;overflow:hidden;user-select:none}
.ticker:hover{background:linear-gradient(180deg,rgba(10,12,18,.92),var(--panel))}
.ticker .tag{flex:none;display:flex;align-items:center;gap:6px;margin:0 12px;padding:3px 10px;border-radius:6px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  background:var(--accent-glow);color:var(--accent);border:1px solid rgba(255,122,69,.28)}
.ticker .live{width:6px;height:6px;border-radius:99px;background:var(--accent);animation:blip 2.2s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.ticker .rail-wrap{flex:1;overflow:hidden;min-width:0;
  -webkit-mask-image:linear-gradient(to left,transparent,#000 26px,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to left,transparent,#000 26px,#000 calc(100% - 26px),transparent)}
.ticker .feed{display:flex;gap:30px;white-space:nowrap;font-size:13px;color:var(--ink-2);width:max-content;
  animation:tick 60s linear infinite}
.ticker:hover .feed{animation-play-state:paused}
.ticker .feed b{color:var(--ink);font-weight:700}
.ticker .it-b{color:var(--bad)} .ticker .it-g{color:var(--good)}
.ticker .it-w{color:var(--warn)} .ticker .it-a{color:var(--accent)} .ticker .it-v{color:var(--violet)}
.ticker .sep{color:var(--ink-3);opacity:.5}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){
  .ticker .feed{animation:none;width:100%;overflow:hidden;text-overflow:ellipsis}
  .ticker .live{animation:none}
}

/* charts */
svg.ch{width:100%;height:auto;display:block;overflow:visible;max-width:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:9px;min-width:0}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-inline-end:5px}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(4,6,11,.82);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;overscroll-behavior:contain}
.scrim[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;max-width:620px;width:100%;
  box-shadow:0 44px 90px -34px #000;animation:pop .2s ease-out;
  margin:auto;display:flex;flex-direction:column;max-height:calc(100dvh - 32px);overflow:hidden}
.modal.wide{max-width:940px}
@keyframes pop{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}.meter>span{transition:none}}
.modal .top{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;gap:10px;align-items:center;flex:0 0 auto}
.modal .top h3{font-size:17.5px;flex:1}
.modal .bd{padding:18px 20px;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.modal .bd p{margin:0 0 11px;color:var(--ink-2)}
.modal .ft{padding:13px 20px;border-top:1px solid var(--line);background:var(--panel-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;flex:0 0 auto;padding-bottom:calc(13px + env(safe-area-inset-bottom))}
.x{color:var(--ink-2);font-size:22px;line-height:1;min-width:38px;min-height:38px;border-radius:9px;flex:0 0 auto}
.x:hover,.x:active{background:var(--raise);color:var(--ink)}
.choice{display:block;width:100%;text-align:right;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:9px;transition:border-color .12s,background .12s}
.choice:hover{border-color:var(--accent);background:var(--raise)}
.choice b{display:block;font-size:14.5px}
.choice span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* intro */
.intro{max-width:1080px;margin:0 auto;padding:6vh 20px 60px}
.intro{position:relative}
.intro::before{content:'';position:absolute;top:-12vh;right:-10vw;width:70vw;height:52vh;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,122,69,.13),transparent 72%);filter:blur(8px);z-index:-1}
.intro .kick{font-family:var(--mono);color:var(--accent);letter-spacing:.24em;text-transform:uppercase;font-size:11px}
.intro h1{font-size:clamp(38px,7vw,68px);font-weight:900;line-height:.98;margin:10px 0 8px}
.intro .lead{color:var(--ink-2);font-size:17px;max-width:70ch}
.rule{height:1px;background:linear-gradient(90deg,var(--accent),transparent);margin:26px 0}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;margin-top:16px}
.co{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:right;
  transition:border-color .14s,transform .14s,box-shadow .14s}
.co:hover{box-shadow:0 16px 34px -22px #000}
.co:hover{border-color:var(--accent);transform:translateY(-2px)}
.co.on{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-glow),var(--panel))}
.co b{display:block;font-family:var(--display);font-size:17px}
.co .tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.co .d{font-size:12.5px;color:var(--ink-2);margin-top:7px;min-height:52px}
.co .kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-soft);padding-top:6px;margin-top:6px}

/* ═══════════ מסכי מגע וטלפונים ═══════════ */
.dock{display:none}
.only-sm{display:none}
.only-lg{display:block}
.wrap{padding-bottom:78px}
@media (max-width:900px){
  body{font-size:15.5px}
  .wrap{padding:12px 12px 152px}
  .bar{padding:8px 12px calc(8px + env(safe-area-inset-top))}
  .bar-in{gap:10px}
  .who{min-width:0;flex:1}
  .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  .bar-in>.row{margin-inline-start:0}
  /* כפתור התור עובר לתחתית, בטווח האגודל */
  #nextBtn{display:none}
  .ticker{bottom:calc(70px + env(safe-area-inset-bottom));height:34px}
  .ticker .feed{font-size:12.5px}
  .ticker .tag{margin:0 9px}
  .dock{display:block;position:fixed;bottom:0;right:0;left:0;z-index:60;
    background:linear-gradient(180deg,rgba(10,12,18,.72),var(--ground) 42%);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .dock button{width:100%;padding:14px;font-size:16.5px;border-radius:12px}
  /* מדדים: רצועה נגללת */
  .stats{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;gap:0;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .stats::-webkit-scrollbar{display:none}
  .stat{min-width:auto;padding:0 12px;flex:0 0 auto}
  .stat b{font-size:14.5px}
  .stat i{font-size:9.5px;letter-spacing:.06em}

/* ── §6 מאגר שמות לטאלנטים ומטרות רכישה ─────────────────────────────────── */
const FN=['נועה','איתי','מאיה','יונתן','שירה','עומר','תמר','דניאל','ליאור','רותם','אבישי','הילה','ניר','אלה','גיא','שקד','ארז','יעל','אורי','מיכל'];
const LN=['ברקוביץ׳','חן','נאקאמורה','אוקונקוו','פארק','זילברמן','טאן','מוראלס','אבו-חסן','לינדגרן','קומאר','דה-סילבה','וונג','אשכנזי','פטרוב','אוקאדה'];
const ROLES={
  eng:{n:'מהנדס/ת ליבה', w:{efficiency:.5,creativity:.3,leadership:.2}},
  sci:{n:'מדען/ית מחקר', w:{creativity:.6,efficiency:.25,leadership:.15}},

/* ── §7 יצירת מצב ────────────────────────────────────────────────────────── */
function newGame(coId,seedStr,opts){
  opts=opts||{};
  const G={
    rs:hash32(seedStr||String(Math.random())), seed:seedStr||'',
    t:0, over:false, ending:null, mode:opts.mode||'ceo',
    cos:{}, me:coId, creator:opts.creator||null,
    market:{total:70, growth:0.0026},          // $B לחודש בהוצאה צרכנית על מכשירים
    spot:{}, suppliers:baseSuppliers(),
    talent:[], startups:[], nextId:1,
    macro:{tax:0.23, tariff:0, sentiment:1, shock:null, shockLeft:0, rate:0.042},
    career:{rep:52, history:[], offers:[], firedCount:0, tenure:0, titles:[]},
    news:[], log:[], hist:[], paraHist:[], flags:{}, ach:[],
    ops:{esp:0,sab:0,hype:0,cin:0}, opsLog:[], heat:0,
    pending:[]
  };
  CK.forEach(c=>G.spot[c]=1);
  CO_DEFS.forEach(d=>{
    const c={
      id:d.id,n:d.n,tag:d.tag,d:d.d,playable:d.playable,
      cash:d.cash, debt:d.cash*0.22, brand:d.brand, board:60,
      tech:{}, staff:[], products:[], contracts:[],
      rndBudget:d.rev*12*d.style.rndShare, marketing:d.rev*0.020,
      style:Object.assign({},d.style), homeFocus:d.style.focus, baseRev:d.rev,
      traits:Object.assign({},d.traits||{}), installed:d.inst||d.rev*85, lockin:34,
      hist:[], opHist:[], scandal:0, counter:d.style.ops*0.5,
      isMe:d.id===coId
    };
    TK.forEach(k=>{const str=d.tech[k]!==undefined?d.tech[k]:(30+hash32(d.id+k)%22);
      c.tech[k]=clamp(FRONT0[k]*(0.52+0.48*(str/95)),3,99);});
    /* תיק פתיחה: לכל חברה מוצר חי בכל פרדיגמה שבה יש לה נוכחות */
    PK.forEach(p=>{
      const s=d.str[p]||0; if(s<1)return;
      const pr=PARA[p];
      const prod=mkProduct(G,c,p,{name:d.tag+' '+pr.short,price:Math.round(pr.price*rr(G,.9,1.1)),spec:3,mkt:c.marketing*0.18});
      prod.state='live'; prod.launch=-ri(G,1,9); prod.score=scoreOf(G,c,prod);
      prod.seed=s; c.products.push(prod);
    });
    G.cos[d.id]=c;
  });
  refreshTalent(G,10); seedStartups(G,4); seedCreators(G);
  measureParadigms(G);
  if(G.mode==='creator'){
    G.me=null;
    news(G,`<b>${G.creator.name}</b> (${G.creator.handle}) מעלה סרטון ראשון. אף אחד עוד לא צופה.`,'v');
  } else {
    const me=G.cos[coId];
    G.career.titles.push({co:coId,from:0});
    news(G,`מונית למנכ״ל ${me.n}. השוק מחכה לראות מה תעשה עם הכיסא.`,'a');
  }
  return G;
}

/* ── §8 מוצרים ──────────────────────────────────────────────────────────── */
function mkProduct(G,c,para,o){
  o=o||{};
  return {id:G.nextId++, co:c.id, para, name:o.name||(c.tag+' '+PARA[para].short),
    price:o.price||PARA[para].price, spec:o.spec||3, cfg:o.cfg||defCfg(para,o.spec||3),
    keynote:o.keynote||0, review:0, mkt:o.mkt||0.05,
    state:'dev', start:G.t, launch:o.launch!==undefined?o.launch:G.t+PARA[para].dev,
    score:0, units:0, rev:0, hype:0, sabotage:0, defect:false, legacy:false, lastUnits:0};
}
function scoreOf(G,c,p){
  const pr=PARA[p.para]; let base=0;
  for(const k in pr.en) base+=(c.tech[k]||0)*pr.en[k];
  const cf=cfgOf(p), q=cfgQuality(p), M=pr.mods;
  /* דרגת מודול גבוהה מאפשרת לידע שלכם באותו תחום להתבטא במוצר בפועל */
  let edge=0;
  modsOf(p.para).forEach(k=>{edge+=M[k][0]*((c.tech[PARTS[k].node]||0)-58)*0.115*TIER_Q[(cf[k]||3)-1];});
  const ready=clamp((p.launch-p.start)/pr.dev,0,1.4);
  const rush=Math.pow(clamp(1-ready,0,1),1.5)*30;
  const staffB=staffBonus(c)*4;
  return clamp(base*(0.62+0.38*q)+edge+staffB-rush-(p.sabotage||0)-(p.defect?15:0),5,140);
}
function bomOf(G,c,p){
  const pr=PARA[p.para], cf=cfgOf(p), M=pr.mods;
  let t=0;
  modsOf(p.para).forEach(k=>{t+=M[k][1]*TIER_COST[clamp(cf[k]||3,1,5)-1]*effPrice(G,c,PARTS[k].comp);});
  t+=pr.asm*effPrice(G,c,'assembly')*(0.72+avgTier(p)*0.09);
  const eff=1-((c.traits&&c.traits.costEff)||0)*0.13;
  return t*eff*(1+G.macro.tariff*0.4);
}
/* מחיר רכיב בפועל — חוזה נעול מגן מפני זינוק בשוק הספוט */
function effPrice(G,c,comp){
  const ct=(c.contracts||[]).find(x=>x.comp===comp&&x.left>0);
  if(ct) return Math.min(ct.price, G.spot[comp]*1.02);
  return G.spot[comp];
}
const KEYNOTE=[{n:'ללא אירוע',hype:0,cost:0},{n:'חשיפה סטנדרטית',hype:.20,cost:.018},{n:'כנס ראווה גלובלי',hype:.46,cost:.055}];
function keynoteCost(c,k){return (KEYNOTE[k]||KEYNOTE[0]).cost*Math.max(0.6,c.baseRev);}
/* ציון ביקורות: יחסי לטוב ביותר שקיים בשוק באותו רגע, ומושפע מתמורה למחיר */
function computeReview(G,c,p){
  let best=0;
  for(const id in G.cos)G.cos[id].products.forEach(x=>{if(x.state==='live'&&x.para===p.para&&x.score>best)best=x.score;});
  best=Math.max(best,p.score,30);
  const rel=p.score/best;
  const value=Math.pow(PARA[p.para].price/Math.max(40,p.price),0.45);
  let r=4.6+(rel-1)*26+(value-1)*7+(p.defect?-2.8:0)+(rand(G)-0.5)*0.7;
  if((p.hype||0)>0.35&&rel<0.92)r-=1.1;            // ציפיות מנופחות נענשות
  return clamp(Math.round(r*10)/10,1,10);
}
function freshness(age){return clamp(0.32+0.95*Math.exp(-Math.max(0,age)/12),0.30,1.27);}
function appealOf(G,c,p){
  const pr=PARA[p.para];
  const q=Math.pow(clamp(p.score,5,140)/70,1.75);
  const val=Math.pow(pr.price/Math.max(40,p.price),pr.el);
  const fr=freshness(G.t-p.launch)*(p.legacy?(c.traits&&c.traits.multibrand?0.86:0.6):1);
  const br=0.66+0.34*(c.brand/72);
  const norm=0.02*Math.max(0.3,c.baseRev);
  const mk=1+clamp(p.mkt/norm-1,-0.8,3.2)*0.135;
  const hy=1+clamp(p.hype||0,0,1)*0.75;
  const T=c.traits||{};
  /* הפצה פיזית רחבה שווה בעיקר במכשירים זולים */
  const reach=1+(T.reach||0)*0.34*clamp(1.45-p.price/pr.price,0,1)*(0.6+(c.tech.distribution||40)/150);
  const carrier=1+(T.carrier||0)*0.24*(0.6+(c.tech.distribution||40)/150);
  const lock=1+clamp((c.lockin||0)/100,0,1)*0.17;
  const rev=reviewFactor(G,p);
  return q*val*fr*br*mk*hy*reach*carrier*lock*rev*(p.seed?p.seed/8:1);
}
/* ביקורות ההשקה מזיזות את הרבעון הראשון ואז מתפוגגות */
function reviewFactor(G,p){
  if(!p.review)return 1;
  const age=G.t-p.launch;
  if(age>4)return 1;
  const f=1+(p.review-6.5)*0.10;
  return clamp(lerp(f,1,age/4),0.65,1.5);
}
function staffBonus(c){
  if(!c.staff.length)return 0;
  return clamp(sum(c.staff.map(s=>s.creativity/100))*0.9,0,14);
}
function rndMult(c){
  return clamp(1+sum(c.staff.map(s=>s.efficiency/100))*0.055,1,2.4)*(1+clamp(c.morale===undefined?0:(c.morale-60)/400,-.12,.12));
}

/* ── §9 מו"פ ופרדיגמות ──────────────────────────────────────────────────── */
/* גבול הידע התעשייתי לכל צומת = הרמה הגבוהה בעולם. פרדיגמה מבשילה כאשר
   הממוצע המשוקלל של הצמתים שמאפשרים אותה חוצה את הסף שלה.               */
function frontier(G,k){let m=0;for(const id in G.cos){const v=G.cos[id].tech[k]||0;if(v>m)m=v;}return m;}
function measureParadigms(G){
  G.para=G.para||{};
  PK.forEach(p=>{
    const pr=PARA[p]; let r=0;
    for(const k in pr.en) r+=frontier(G,k)*pr.en[k];
    const prev=G.para[p]?G.para[p].ready:r;
    G.para[p]={ready:r, open:r>=pr.viab, momentum:r-prev,
               heat:G.para[p]?G.para[p].heat:0};
  });
}
function rndTick(G,c){
  const mo=c.rndBudget/12, mult=rndMult(c);
  const alloc=c.alloc||defaultAlloc(c);
  const tot=sum(TK.map(k=>alloc[k]||0))||1;
  TK.forEach(k=>{
    const spendY=mo*12*((alloc[k]||0)/tot);
    if(spendY<=0){c.tech[k]=clamp(c.tech[k]-0.06,0,100);return;}
    const lvl=c.tech[k], fr=frontier(G,k), behind=fr-lvl;
    const catchUp=behind>0.5?1+clamp(behind,0,30)*0.026:0.68;
    /* התמחות הצוות מאיצה צומת ספציפי */
    const spec=1+clamp(sum(c.staff.filter(s=>s.spec===k).map(s=>s.efficiency/100))*0.16,0,0.8);
    let gain=0.60*Math.sqrt(spendY)/(1+lvl/40)*catchUp*mult*spec;
    gain-=0.10+lvl*0.0028;
    c.tech[k]=clamp(lvl+gain,0,100);
  });
  /* פריצת דרך: תלויה ביצירתיות הצוות, לא בתאריך */
  const chance=sum(c.staff.map(s=>s.creativity))/9000+(c.rndBudget>c.baseRev*12*0.14?0.004:0);
  if(rand(G)<chance){
    const alloc2=c.alloc||defaultAlloc(c);
    const hot=TK.filter(k=>(alloc2[k]||0)>0).sort((a,b)=>(alloc2[b]||0)-(alloc2[a]||0)).slice(0,4);
    const k=pick(G,hot.length?hot:TK);
    c.tech[k]=clamp(c.tech[k]+rr(G,3,7),0,100);
    if(c.isMe)news(G,`פריצת דרך במעבדות: קפיצה בלתי צפויה ב<b>${TECH[k].n}</b>.`,'v');
    else if(rand(G)<0.4)news(G,`${c.n} מדווחת על פריצת דרך ב${TECH[k].n}.`,'i');
  }
}
function defaultAlloc(c){
  if(c.allocCache)return c.allocCache;
  const a={}; TK.forEach(k=>a[k]=1);
  const f=PARA[c.style.focus]; if(f)for(const k in f.en)a[k]=2+f.en[k]*14;
  c.allocCache=a; return a;
}
/* ── §10 שוק דינמי ──────────────────────────────────────────────────────────
   נתח ההוצאה של כל פרדיגמה נגזר מהבשלות הטכנולוגית שלה, מאיכות המוצר הטוב
   ביותר שקיים בה ומחיכוך האימוץ — לא מלוח שנה.                            */
const PULL={phone:1.0, fold:0.86, glasses:0.92, ambient:0.78, robot:0.72, neural:0.6};
function marketTick(G){
  measureParadigms(G);
  const M=G.market;
  M.base=(M.base||M.total)*(1+M.growth*G.macro.sentiment+(rand(G)-.5)*0.004);
  const live={}; PK.forEach(p=>live[p]=[]);
  for(const id in G.cos)G.cos[id].products.forEach(p=>{if(p.state==='live')live[p.para].push({c:G.cos[id],p});});
  const A={};
  PK.forEach(p=>{
    const pr=PARA[p], st=G.para[p];
    const mat=clamp((st.ready-pr.viab)/(100-pr.viab),0,1);
    const best=live[p].length?Math.max.apply(null,live[p].map(x=>x.p.score)):0;
    st.mat=mat;
    A[p]=mat<=0?0:Math.pow(mat,1.30)*(1+best/80)*PULL[p]*(1+clamp(st.heat,-.3,1.2));
    st.heat*=0.86;
  });
  /* רוחב הקטגוריות: ככל שיותר פרדיגמות בשלות, כך גדלה ההוצאה הכוללת בעולם */
  const breadth=sum(PK.map(p=>(G.para[p].mat||0)*PULL[p]));
  if(M.breadth0===undefined)M.breadth0=breadth;
  M.total=M.base*clamp(1+0.62*(breadth-M.breadth0),0.72,2.8);
  const tA=sum(PK.map(p=>A[p]))||1;
  const res={byPara:{},byCo:{}};
  for(const id in G.cos)res.byCo[id]={rev:0,cogs:0,units:0,mkt:0};
  PK.forEach(p=>{
    const spend=M.total*(A[p]/tA);
    const st0=G.para[p];
    st0.spend=spend; st0.share=A[p]/tA;
    st0.sh=(st0.sh||[]).concat([st0.share]); if(st0.sh.length>14)st0.sh.shift();
    st0.declining=st0.sh.length>6&&st0.sh[st0.sh.length-1]<st0.sh[st0.sh.length-7]*0.96;
    const lst=live[p];
    const ap=lst.map(x=>({...x,a:appealOf(G,x.c,x.p)}));
    const tot=sum(ap.map(x=>x.a));
    res.byPara[p]={spend,players:ap.length};
    ap.forEach(x=>{
      const rev=tot>0?spend*(x.a/tot):0;
      const units=rev*1000/Math.max(40,x.p.price);       // מיליוני יחידות
      const bom=bomOf(G,x.c,x.p);
      x.p.lastUnits=units; x.p.units=(x.p.units||0)+units; x.p.rev=(x.p.rev||0)+rev; x.p.lastRev=rev;
      const R=res.byCo[x.c.id];
      R.rev+=rev; R.cogs+=units*bom/1000; R.units+=units; R.mkt+=x.p.mkt;
      x.p.marg=rev>0?1-(units*bom/1000)/rev:0;
      /* הייפ מתפוגג, ואם המוצר לא עומד בו — יש מחיר */
      if(x.p.hype>0){
        x.p.hype=Math.max(0,x.p.hype-0.22);
        if(x.p.score<66&&x.p.hype>0.35&&rand(G)<0.16){
          x.c.brand=clamp(x.c.brand-3.4,15,100); x.p.hype=0;
          if(x.c.isMe)news(G,`גל החזרות של <b>${x.p.name}</b>: הפער בין הקמפיין למוצר התפוצץ ברשת.`,'b');
        }
      }
    });
  });
  return res;
}

/* ── §11 שרשרת אספקה ────────────────────────────────────────────────────── */
function supplyTick(G){
  const sh=G.macro.shock;
  CK.forEach(k=>{
    let drift=(rand(G)-.5)*0.035;
    if(sh&&sh.comp&&sh.comp.indexOf(k)>=0)drift+=0.075*(G.macro.shockLeft>0?1:0);
    else drift-=0.012*(G.spot[k]-1);                    // חזרה לממוצע
    G.spot[k]=clamp(G.spot[k]*(1+drift),0.55,3.4);
  });
  for(const id in G.cos){
    const c=G.cos[id];
    c.contracts.forEach(ct=>{
      if(ct.left>0){
        ct.left--;
        /* Take-or-pay: משלמים על המחויבות גם אם לא ייצרנו */
        const need=sum(c.products.filter(p=>p.state==='live').map(p=>(recipeOf(p.para)[ct.comp]||0)*p.lastUnits))/1000;
        const commit=ct.vol*0.7;
        if(need<commit)c.cash-=(commit-need)*ct.price*0.001;
      }
    });
    c.contracts=c.contracts.filter(ct=>ct.left>0);
  }
}
function signContract(G,c,comp,months,volShare){
  const sup=G.suppliers.filter(s=>s.cov.indexOf(comp)>=0);
  const s=sup.length?sup.reduce((a,b)=>a.prem<b.prem?a:b):null;
  if(!s)return null;
  const price=G.spot[comp]*(1+s.prem+months*0.004);
  const vol=volShare;
  c.contracts.push({comp,price,left:months,vol,sup:s.id,signedAt:G.t,signedSpot:G.spot[comp]});
  return {comp,price,months,sup:s};
}

/* ── §12 טאלנטים ────────────────────────────────────────────────────────── */
function mkCandidate(G){
  const role=pick(G,keys(ROLES));
  const q=rr(G,0.35,1);
  const st=v=>Math.round(clamp(v*100*rr(G,.75,1.15),18,99));
  const c={id:G.nextId++, name:pick(G,FN)+' '+pick(G,LN), role,
    creativity:st(q*(role==='sci'?1.15:role==='des'?1.1:.85)),
    efficiency:st(q*(role==='eng'?1.15:.9)),
    leadership:st(q*(role==='exec'?1.25:.8)),
    spec:pick(G,TK), ego:rr(G,0.1,0.9), patience:100, rounds:0, from:G.t};
  const power=(c.creativity+c.efficiency+c.leadership)/3;
  c.ask=Math.round(clamp(Math.pow(power/50,2.6)*46,18,520));   // $M לשנה לצוות שהוא/היא מוביל/ה
  return c;
}
function refreshTalent(G,n){for(let i=0;i<n;i++)G.talent.push(mkCandidate(G));}
function talentTick(G){
  G.talent.forEach(c=>{c.patience=clamp(c.patience+1.5,0,100);});
  /* מועמדים מתייאשים ועוזבים; חדשים נכנסים */
  G.talent=G.talent.filter(c=>G.t-c.from<10||rand(G)>0.35);
  if(G.talent.length<9)refreshTalent(G,ri(G,1,3));
  /* יריבים מגייסים מהמאגר, ולפעמים מהצוות שלנו */
  for(const id in G.cos){
    const c=G.cos[id]; if(c.isMe)continue;
    if(rand(G)<0.10+c.style.agg*0.10&&G.talent.length){
      const t=G.talent.reduce((a,b)=>(a.creativity+a.efficiency)>(b.creativity+b.efficiency)?a:b);
      const cost=t.ask/1000;
      if(c.cash>cost*3){hireTo(G,c,t);}
    }
    /* ציד ראשים אצל השחקן */
    const me=G.cos[G.me];
    if(me&&me.staff.length&&rand(G)<0.022*(1+c.style.agg)){
      const target=pick(G,me.staff);
      const loyal=0.4+(me.brand/260)+(target.equity?0.25:0)+clamp((G.career.rep-50)/220,-.2,.2);
      if(rand(G)>loyal){
        me.staff=me.staff.filter(s=>s!==target);
        c.staff.push(target);
        news(G,`<b>${target.name}</b> עוזב/ת אותנו ל${c.n}. ההצעה שם הייתה כפולה.`,'b');
      }
    }
  }
}
function hireTo(G,c,t){
  G.talent=G.talent.filter(x=>x!==t);
  c.staff.push(t); c.allocCache=null;
}
/* מנוע המשא ומתן: מחזיר החלטה, נגד-הצעה ומחיר הסבלנות */
function evaluateOffer(G,cand,offer){
  const c=G.cos[G.me];
  const prestige=clamp((c.brand-55)/180+(G.career.rep-50)/200,-0.22,0.28);
  const reserve=cand.ask*(1+cand.ego*0.34-prestige)*(1-(offer.equity?0.11:0))*(offer.title?0.94:1);
  const gap=(reserve-offer.salary)/reserve;
  if(gap<=0)return {accept:true,reserve};
  const loss=clamp(gap*105*(0.55+cand.ego*0.9),6,70);
  cand.patience=clamp(cand.patience-loss,0,100);
  cand.rounds++;
  const counter=Math.round(lerp(offer.salary,reserve,0.62));
  return {accept:false,counter,reserve,walked:cand.patience<=0,gap};
}

/* ── §13 מיזוגים ורכישות ────────────────────────────────────────────────── */
function seedStartups(G,n){
  for(let i=0;i<n;i++){
    const focus=pick(G,PK), pr=PARA[focus];
    const nodes=keys(pr.en).sort((a,b)=>pr.en[b]-pr.en[a]).slice(0,3);
    const s={id:G.nextId++, n:pick(G,STARTUP_N)+' '+pick(G,['Labs','Systems','Micro','Dynamics','Works']),
      focus, tech:{}, born:G.t, staff:[mkCandidate(G)]};
    nodes.forEach(k=>s.tech[k]=Math.round(clamp(frontier(G,k)*rr(G,0.9,1.28),10,100)));
    s.hype=rr(G,0.6,1.7);
    s.price=Math.round((sum(vals(s.tech))/40+2)*s.hype*10)/10;
    G.startups.push(s);
  }
}
function startupTick(G){
  G.startups.forEach(s=>{
    keys(s.tech).forEach(k=>s.tech[k]=clamp(s.tech[k]+rr(G,0.15,0.75),0,100));
    s.price=Math.round((sum(vals(s.tech))/40+2)*s.hype*(1+G.para[s.focus].mat*0.9)*10)/10;
  });
  /* יריבים חוטפים מטרות — מי שמתלבט מפסיד */
  if(G.startups.length&&rand(G)<0.085){
    const s=pick(G,G.startups);
    const buyers=vals(G.cos).filter(c=>!c.isMe&&c.cash>s.price*2.4&&c.style.focus===s.focus);
    if(buyers.length){
      const b=pick(G,buyers);
      acquire(G,b,s);
      news(G,`<b>${b.n}</b> רוכשת את ${s.n} תמורת $${s.price}B. הטכנולוגיה ירדה מהשוק.`,'w');
    }
  }
  if(G.startups.length<3&&rand(G)<0.3)seedStartups(G,1);
}
/* רכישת חברה שלמה — אפשרית בעיקר כשהיא בקשיים */
function companyValue(G,t){
  const rev12=sum(t.hist.slice(-12).map(h=>h.rev))||t.baseRev*12;
  const techV=sum(TK.map(k=>t.tech[k]))/22;
  const mult=t.distress>3?1.1:t.op>0?3.4:2.1;
  return Math.max(1.2,Math.round((rev12*0.55*mult/6+techV*0.32+t.brand*0.05)*10)/10);
}
function acquireCompany(G,buyer,t){
  buyer.cash-=companyValue(G,t);
  TK.forEach(k=>{buyer.tech[k]=clamp(Math.max(buyer.tech[k],t.tech[k]*0.96),0,100);});
  t.staff.forEach(p=>{if(rand(G)<0.55)buyer.staff.push(p);});
  t.products.filter(p=>p.state==='live').sort((a,b)=>b.score-a.score).slice(0,2).forEach(p=>{
    p.co=buyer.id; p.name=buyer.tag+' '+p.name.split(' ').slice(1).join(' '); buyer.products.push(p);
  });
  buyer.baseRev+=t.baseRev*0.62;
  buyer.brand=clamp(buyer.brand*0.93+t.brand*0.12,15,100);
  buyer.allocCache=null;
  delete G.cos[t.id];
  news(G,`<b>${buyer.n} רוכשת את ${t.n}.</b> התיק, הפטנטים והצוות עוברים בעלות.`,'a');
}
function acquire(G,c,s){
  G.startups=G.startups.filter(x=>x!==s);
  c.cash-=s.price;
  keys(s.tech).forEach(k=>{c.tech[k]=clamp(Math.max(c.tech[k],s.tech[k]*0.94),0,100);});
  s.staff.forEach(p=>{if(rand(G)<0.62)c.staff.push(p);});   // חלק מהצוות עוזב באינטגרציה
  c.morale=clamp((c.morale===undefined?65:c.morale)-4,10,100);
  c.allocCache=null;
}

/* ── §14 מבצעים שחורים ──────────────────────────────────────────────────── */
function opsTick(G){
  const me=G.cos[G.me]; if(!me)return;
  const O=G.ops, tgtId=O.target||pickRivalId(G), tgt=G.cos[tgtId];
  const spend=(O.esp+O.sab+O.hype+O.cin)/1000;
  me.cash-=spend;
  G.heat=clamp(G.heat*0.93+(O.esp+O.sab)/900,0,3);
  me.counter=clamp(me.counter*0.9+O.cin/260,0,1.6);
  /* ריגול */
  if(O.esp>0&&tgt){
    const p=clamp(O.esp/(O.esp+150+tgt.counter*220),0,0.8);
    if(rand(G)<p){
      const gaps=TK.filter(k=>tgt.tech[k]>me.tech[k]+3);
      if(gaps.length){
        const k=pick(G,gaps);
        const before=me.tech[k];
        me.tech[k]=clamp(me.tech[k]+(tgt.tech[k]-me.tech[k])*0.38,0,100);
        opLog(G,`שרטוטים מ${tgt.n}: ${TECH[k].n} קפץ מ-${Math.round(before)} ל-${Math.round(me.tech[k])}.`,'a');
      }
    }
    if(rand(G)<clamp(O.esp/620*(0.45+tgt.counter),0,0.5))scandal(G,'ריגול תעשייתי',tgt);
  }
  /* חבלה והדלפות */
  if(O.sab>0&&tgt){
    const dev=tgt.products.filter(x=>x.state==='dev');
    const p=clamp(O.sab/(O.sab+190+tgt.counter*200),0,0.72);
    if(dev.length&&rand(G)<p){
      const d=pick(G,dev);
      if(rand(G)<0.5){d.sabotage=(d.sabotage||0)+rr(G,5,14);opLog(G,`הדלפה מוקדמת על ${d.name} של ${tgt.n} — הציפיות נשחקו לפני ההשקה.`,'w');}
      else {d.launch+=1;opLog(G,`שיבוש בשרשרת של ${tgt.n}: ההשקה של ${d.name} נדחתה בחודש.`,'w');}
    }
    if(rand(G)<clamp(O.sab/560*(0.5+tgt.counter),0,0.5))scandal(G,'הדלפות ושיבוש מכוון',tgt);
  }
  /* הייפ ומשפיענים */
  if(O.hype>0){
    const mine=me.products.filter(x=>x.state==='live').sort((a,b)=>b.launch-a.launch)[0];
    if(mine){mine.hype=clamp((mine.hype||0)+O.hype/420,0,1);
      G.para[mine.para].heat=clamp(G.para[mine.para].heat+O.hype/2600,0,1.2);}
    if(rand(G)<clamp(O.hype/900,0,0.16))scandal(G,'קמפיין משפיענים מבוים',null);
  }
  /* יריבים תוקפים אותנו */
  for(const id in G.cos){
    const c=G.cos[id]; if(c.isMe)continue;
    const intensity=c.style.ops*(0.5+c.style.agg);
    if(rand(G)<intensity*0.09){
      const def=clamp(me.counter,0,1.5);
      if(rand(G)>def*0.55){
        const dev=me.products.filter(x=>x.state==='dev');
        if(dev.length&&rand(G)<0.5){
          const d=pick(G,dev); d.sabotage=(d.sabotage||0)+rr(G,4,11);
          news(G,`דליפה מוזרה על <b>${d.name}</b> הופיעה בפורומים. מישהו רוצה שההשקה תיפגע.`,'b');
        } else {
          const gaps=TK.filter(k=>me.tech[k]>c.tech[k]+4);
          if(gaps.length){const k=pick(G,gaps);c.tech[k]=clamp(c.tech[k]+(me.tech[k]-c.tech[k])*0.3,0,100);
            if(rand(G)<0.45)news(G,`${c.n} הציגה יכולת ב${TECH[k].n} שנראית חשודה עד כאב.`,'w');}
        }
      }
    }
  }
}
function pickRivalId(G){const o=keys(G.cos).filter(k=>k!==G.me);return o[0];}
function opLog(G,text,k){G.opsLog.unshift({t:G.t,text,k:k||'a'});if(G.opsLog.length>60)G.opsLog.pop();news(G,text,k||'a');}
function scandal(G,kind,tgt){
  const me=G.cos[G.me];
  const fine=clamp(me.cash*rr(G,0.01,0.045),0.2,6);
  me.cash-=fine; me.brand=clamp(me.brand-rr(G,3,9),15,100);
  me.board=clamp(me.board-rr(G,6,16),0,100);
  G.career.rep=clamp(G.career.rep-rr(G,5,14),0,100);
  me.scandal++;
  G.ops={esp:0,sab:0,hype:0,cin:G.ops.cin};
  news(G,`<b>שערוריית ${kind}.</b> ${tgt?tgt.n+' הגישה תלונה. ':''}קנס של $${rnd1(fine,1)}B, המניה צונחת והדירקטוריון דורש הסברים.`,'b');
}

function macroTick(G){
  const M=G.macro;
  M.sentiment=clamp(lerp(M.sentiment,1,0.06)+(rand(G)-.5)*0.05,0.6,1.45);
  if(M.shockLeft>0){M.shockLeft--;if(M.shockLeft===0)M.shock=null;}
  else if(rand(G)<0.035){
    const comps=[['wafer','memory'],['battery','rare'],['display'],['assembly'],['sensors']][ri(G,0,4)];
    M.shock={comp:comps,n:comps.map(c=>COMP[c].n).join(' ו')}; M.shockLeft=ri(G,3,8);
    news(G,`מתיחות בשרשרת האספקה: מחירי <b>${M.shock.n}</b> מתחילים לטפס.`,'w');
  }
}
function drawEvent(G){
  const pool=EVENTS.filter(e=>!G.flags['ev_'+e.id]&&(!e.req||e.req(G)));
  if(!pool.length)return null;
  const p=0.085+G.t*0.0006;
  if(rand(G)>p)return null;
  const tw=sum(pool.map(e=>e.w));
  let r=rand(G)*tw;
  for(const e of pool){r-=e.w;if(r<=0){G.flags['ev_'+e.id]=1;return e;}}
  return null;
}

/* ── §16 מוחות המתחרים ──────────────────────────────────────────────────────
   כל יריבה מקצה מו״פ, משיקה מוצרים, מתמחרת ורוכשת לפי אסטרטגיה משלה —
   ומגיבה גם לתנופה של פרדיגמות וגם להצלחה שלנו.                          */
function aiTick(G,c){
  if(c.isMe)return;
  const rev12=sum(c.hist.slice(-12).map(h=>h.rev))||c.baseRev*12;
  c.rndBudget=lerp(c.rndBudget,rev12*c.style.rndShare,0.12);
  /* מעקב אחרי הפרדיגמה עם התנופה הגבוהה ביותר */
  const ranked=PK.map(p=>{
    const st=G.para[p], pr=PARA[p];
    const near=clamp(st.ready/pr.viab,0,1);
    const proximity=Math.pow(near,3);
    /* קטגוריה פתוחה שווה לפי גודלה; קטגוריה שעל הסף שווה לפי הפוטנציאל
       להיות ראשון בה — וזה מה שגורם ליריבים לממן את העתיד לפני שהוא קיים. */
    const upside=st.open?st.mat*PULL[p]*2.2:PULL[p]*1.9*proximity*(0.5+c.style.agg);
    const crowd=vals(G.cos).filter(x=>x.style&&x.style.focus===p).length;
    const home=c.homeFocus===p?0.55:(c.style.focus===p?0.3:0);
    return {p, v:upside+st.momentum*2.6+home-crowd*0.10};
  }).sort((a,b)=>b.v-a.v);
  const target=ranked[0].p;
  if(target!==c.style.focus&&rand(G)<0.045+c.style.agg*0.05){
    c.style.focus=target; c.allocCache=null;
    news(G,`<b>${c.n}</b> מסיטה משאבים לכיוון ${PARA[target].n}.`,'i');
  }
  /* אם אנחנו שולטים בפרדיגמה — הם נכנסים אליה */
  const me=G.cos[G.me];
  if(me&&rand(G)<0.05){
    const mine=PK.filter(p=>{
      const tot=sum(vals(G.cos).map(x=>sum(x.products.filter(q=>q.state==='live'&&q.para===p).map(q=>q.lastRev||0))));
      const my=sum(me.products.filter(q=>q.state==='live'&&q.para===p).map(q=>q.lastRev||0));
      return tot>0.4&&my/tot>0.42;
    });
    if(mine.length&&G.para[mine[0]].open){c.style.focus=mine[0];c.allocCache=null;}
  }
  /* השקות */
  const focus=c.style.focus;
  const hasDev=c.products.some(p=>p.state==='dev');
  const newest=c.products.filter(p=>p.state==='live').sort((a,b)=>b.launch-a.launch)[0];
  const stale=!newest||G.t-newest.launch>ri(G,9,15);
  if(!hasDev&&G.para[focus].open&&stale&&c.cash>PARA[focus].nre*1.6){
    const pr=PARA[focus];
    const T=c.traits||{};
    const cheap=T.reach>0.7||T.costEff>0.5;
    const tierBase=cheap?ri(G,1,3):ri(G,2,5);
    const cfg={}; modsOf(focus).forEach(k=>cfg[k]=clamp(tierBase+ri(G,-1,1),1,5));
    if(T.b2b&&cfg.camera)cfg.camera=5;
    if(T.carrier&&cfg.build)cfg.build=clamp(cfg.build-1,1,5);
    const p=mkProduct(G,c,focus,{name:c.tag+' '+pr.short+' '+(turnY(G.t)%100),
      price:Math.round(pr.price*rr(G,0.82,1.14)*(cheap?0.62:c.style.agg>0.65?0.9:1)),
      cfg, mkt:c.marketing*rr(G,0.4,0.9)});
    p.keynote=rand(G)<0.25+c.style.agg*0.3?(rand(G)<0.35?2:1):0;
    p.launch=G.t+Math.round(pr.dev*rr(G,0.75,1.05));
    c.products.push(p); c.cash-=pr.nre*0.4;
  }
  /* תמחור תגובתי */
  c.products.filter(p=>p.state==='live').forEach(p=>{
    const share=p.lastRev||0;
    if(share<0.05&&G.t-p.launch>3&&rand(G)<0.3)p.price=Math.round(p.price*0.955);
    else if(share>0.9&&rand(G)<0.12)p.price=Math.round(p.price*1.02);
  });
  /* רכישות */
  if(G.startups.length&&c.cash>16&&rand(G)<0.03+c.style.agg*0.03){
    const s=G.startups.filter(x=>x.focus===c.style.focus)[0]||G.startups[0];
    if(s&&c.cash>s.price*2.2){acquire(G,c,s);news(G,`${c.n} רוכשת את ${s.n} תמורת $${s.price}B.`,'i');}
  }
}

/* ── §17 פיננסים וקריירה ────────────────────────────────────────────────── */
function industryUnits(G){
  let u=0; for(const id in G.cos)G.cos[id].products.forEach(p=>{if(p.state==='live')u+=p.lastUnits||0;});
  return u;
}
function financeTick(G,c,sales){
  const R=sales.byCo[c.id]||{rev:0,cogs:0,units:0,mkt:0};
  const T=c.traits||{};
  /* ── אקוסיסטם: בסיס מותקן, נעילת משתמשים והכנסה חוזרת ──────────────── */
  c.installed=Math.max(0,(c.installed||0)*0.984+R.units);
  const breadth=PK.filter(p=>c.products.some(x=>x.state==='live'&&x.para===p)).length;
  const target=clamp(12+(c.tech.platform||40)*0.46+breadth*4.4+clamp((c.share||0)*100,0,26)*0.55,0,100);
  c.lockin=clamp(lerp(c.lockin===undefined?34:c.lockin,target,0.12),0,100);
  const arpu=0.34+(c.tech.platform||40)/62+c.lockin/95;   // $ למכשיר פעיל לחודש
  const services=(c.installed*arpu)/1000;
  c.services=services; c.arpu=arpu;
  /* אספקת רכיבים לכל התעשייה — עסק ה-B2B */
  const royalty=T.b2b?industryUnits(G)*(1.1+(c.tech.optics||50)/28)/1000*T.b2b:0;
  c.royalty=royalty;
  const other=c.baseRev*0.08*(0.9+c.brand/400);
  const carrierCost=(T.carrier||0)*R.rev*0.055;           // סבסוד ספקיות סלולר
  const otherOp=services*0.68+other*0.35+royalty*0.55-carrierCost;
  const rev=R.rev+services+other+royalty;
  const gross=(R.rev-R.cogs)+otherOp;
  const sga=rev*0.088;
  const mkt=R.mkt+c.marketing;
  const rd=c.rndBudget/12;
  const staffCost=sum(c.staff.map(s=>s.ask))/12/1000;
  const opsCost=c.isMe?(G.ops.esp+G.ops.sab+G.ops.hype+G.ops.cin)/1000:c.baseRev*c.style.ops*0.01;
  const op=gross-sga-mkt-rd-staffCost-opsCost;
  const tax=op>0?op*G.macro.tax:0;
  const interest=c.debt*G.macro.rate/12;
  const net=op-tax-interest;
  c.cash+=net-c.baseRev*0.02;                            // דיבידנד/החזר הון
  if(c.cash<0){c.debt+=-c.cash+1.5;c.cash=1.5;}
  c.rev=rev; c.op=op; c.net=net;
  const stressed=c.cash<Math.max(1.2,c.baseRev*0.5)&&op<0;
  c.distress=stressed?(c.distress||0)+1:0;
  if(stressed&&!c.isMe){
    c.rndBudget*=0.9; c.marketing*=0.9;
    c.products.filter(x=>x.state==='dev').forEach(x=>{if(rand(G)<0.25)x.state='eol';});
  }
  c.share=shareOf(G,c.id);
  c.shareHist=c.shareHist||[]; c.shareHist.push(c.share); if(c.shareHist.length>40)c.shareHist.shift();
  c.hist.push({t:G.t,rev,op,net,units:R.units,cash:c.cash,brand:c.brand,share:c.share,services,installed:c.installed,lockin:c.lockin});
  if(c.hist.length>140)c.hist.shift();
  /* אמון הדירקטוריון: מול הציפייה, והציפייה עולה אחרי כל הצלחה */
  if(c.expect===undefined)c.expect=Math.max(0.12,op*1.03);
  const beat=op-c.expect;
  if(G.t%3===2){
    const q=sum(c.hist.slice(-3).map(h=>h.op))/3;
    let d=clamp((q-c.expect)/Math.max(0.35,Math.abs(c.expect))*10,-12,9);
    /* דירקטוריון סופר גם צמיחה: תקופת השקעה עם נתח עולה נסלחת */
    const sh=c.shareHist, ago=sh.length>6?sh[sh.length-7]:sh[0];
    d+=clamp((c.share-ago)*100*0.55,-3.5,3.5);
    c.board=clamp(c.board+d,0,100);
    c.expect=lerp(c.expect,Math.max(0.15,q)*1.04,0.5);
  }
  return {rev,op,net,units:R.units,beat};
}

/* איכות אמיתית של מוצר בסולם 1–10, מול הטוב ביותר שקיים בקטגוריה */
function truthOf(G,p){
  let best=0;
  for(const id in G.cos)G.cos[id].products.forEach(x=>{
    if(x.state==='live'&&x.para===p.para&&x.score>best)best=x.score;});
  best=Math.max(best,p.score,30);
  const rel=p.score/best;
  const value=Math.pow(PARA[p.para].price/Math.max(40,p.price),0.45);
  let t=4.6+(rel-1)*26+(value-1)*7+(p.defect?-2.8:0);
  if((p.hype||0)>0.35&&rel<0.92)t-=0.9;
  return clamp(t,1,10);
}
/* משקל דעה = קהל × אמינות. מי שאיבד אמינות, איבד השפעה. */

function creatorVerdict(G,co,p){
  const truth=truthOf(G,p);

    let sc=truth+cr.bias+(rand(G)-0.5)*0.9;
    if(cr.paidBy===co.id&&cr.paidLeft>0)sc+=1.3;
    if(cr.focus===p.para)sc+=0.35;
    return {id:cr.id,n:cr.n,h:cr.h,sc:clamp(Math.round(sc*10)/10,1,10),w:voice(cr)};
  });
  if(G.mode==='creator'&&G.creator&&G.creator.autoReview){
    /* השחקן מסקר אוטומטית רק אם בחר בכך */
  }
  const tw=sum(takes.map(t=>t.w))||1;
  const avg=sum(takes.map(t=>t.sc*t.w))/tw;
  return {score:clamp(Math.round(avg*10)/10,1,10),takes,truth};

/* פרסום ביקורת — של השחקן או של יוצר אחר — מזיז את השוק בפועל */
function publishReview(G,cr,p,score){
  const co=G.cos[p.co]; if(!co)return null;
  const truth=truthOf(G,p);
  const w=voice(cr)/(sum(G.creators.map(voice))+voice(cr));
  const delta=(score-(p.review||truth))*w*0.9;
  p.review=clamp(Math.round(((p.review||truth)+delta)*10)/10,1,10);
  p.reviewAt=G.t;
  /* האמת מתגלה: מי שסטה ממנה משלם באמינות, ולוקח זמן עד שהקהל מבין */
  const miss=Math.abs(score-truth);

        if(rand(G)<risk){p.defect=true;p.score=scoreOf(G,c,p);c.brand=clamp(c.brand-3.2,15,100);}

        p.review=verdict.score; p.reviewAt=G.t; p.takes=verdict.takes.slice(0,5);
        if(c.isMe){
          const kind=p.review>=8.5?'g':p.review>=6.5?'a':'b';
          const top=verdict.takes.sort((a,b)=>b.w-a.w)[0];
          news(G,`<b>${p.name}</b> הושק${p.keynote?' ב'+KEYNOTE[p.keynote].n:''}. ממוצע הביקורות <b>${p.review}/10</b>`+
            (top?` · ${top.n} נתן/ה ${top.sc}`:'')+`. מחיר $${p.price}.`+(p.defect?' דווחו באגים.':''),kind);
        }
        else if(p.review>8.7)news(G,`${c.n} משיקה את ${p.name} — הביקורות נותנות ${p.review}/10 ומדברות על קפיצת דור.`,'w');
      } else if(p.state==='live'){
        p.score=scoreOf(G,c,p);
        if(G.t-p.launch>34&&(p.lastUnits||0)<0.03)p.state='eol';
      }
    });
  }
  const sales=marketTick(G);
  let f=null;
  for(const id in G.cos){const r=financeTick(G,G.cos[id],sales);if(id===G.me)f=r;}
  const me=G.cos[G.me];
  if(G.mode==='creator'){
    const C=G.creator;
    G.career.tenure++;
    G.career.rep=clamp(G.career.rep*0.95+C.cred*0.0367+clamp(C.f,0,25)*0.047,0,100);
    G.hist.push({t:G.t,rev:C.f*0.001,op:0,cash:C.cash*0.001,rep:G.career.rep,board:50,
                 share:0,brand:C.cred,followers:C.f,cred:C.cred,creatorCash:C.cash});
    log(G,`${rnd1(C.f,2)}M עוקבים · אמינות ${Math.round(C.cred)} · הכנסה $${rnd1(creatorRes&&creatorRes.adRev||0,1)}M`,'v');
  } else {
    careerTick(G,f);
    G.hist.push({t:G.t,rev:f.rev,op:f.op,cash:me.cash,rep:G.career.rep,board:me.board,
                 share:shareOf(G,G.me),brand:me.brand});
    log(G,`הכנסות $${rnd1(f.rev,2)}B · רווח תפעולי $${rnd1(f.op,2)}B · ${rnd1(f.units,1)}M יחידות`,f.op>0?'g':'b');
  }
  G.paraHist.push(PK.reduce((o,p)=>{o[p]=G.para[p].ready;return o;},{t:G.t}));
  G.t++;
  const ev=G.mode==='ceo'?drawEvent(G):null;
  const end=checkEnd(G,f);
  return {f,sales,event:ev,end,creator:creatorRes};
}
function shareOf(G,id){
  let mine=0,tot=0;
  for(const cid in G.cos)G.cos[cid].products.forEach(p=>{if(p.state==='live'){tot+=p.lastRev||0;if(cid===id)mine+=p.lastRev||0;}});
  return tot>0?mine/tot:0;
}
function checkEnd(G,f){
  if(G.mode==='creator'){
    const C=G.creator;
    if(C.cred<8&&C.f<0.04)return{kind:'over',t:'הערוץ נסגר',
      d:'איבדת גם את האמינות וגם את הקהל. הסרטונים ממשיכים לשבת שם, בלי שאף אחד לוחץ עליהם.'};
    if(C.cash<-25)return{kind:'over',t:'הסטודיו נסגר',
      d:'ההוצאות רדפו את ההכנסות והחוב סגר את הפינה. הציוד נמכר, והערוץ הפך לארכיון.'};
    return null;
  }
  const me=G.cos[G.me];
  if(me.board<=0)return{kind:'fired',reason:'הדירקטוריון איבד סבלנות אחרי רצף רבעונים חלשים.'};
  if(me.cash<0.4&&me.debt>me.baseRev*14)return{kind:'fired',reason:'הבנקים סירבו למחזר את החוב והשתלטו על ההנהלה.'};
  if(G.career.rep<=3)return{kind:'over',t:'סוף הדרך',d:'המוניטין שלך נשרף עד היסוד. אף דירקטוריון בעולם לא יחזיר אותך לחדר.'};
  return null;
}

function log(G,text,k){G.log.unshift({t:G.t,text,k:k||'i'});if(G.log.length>200)G.log.pop();}

function paintTicker(){
  const f=$('tickerFeed'); if(!f)return;
  const items=S.news.slice(0,14);
  if(!items.length){f.innerHTML='<span class="mut">השווקים נפתחים. אין עדיין דיווחים.</span>';f.style.animation='none';return;}
  /* חוזרים על הרשימה עד שהיא ארוכה מספיק, ואז מכפילים — כך הלולאה רציפה
     ואין רגע שבו הרצועה ריקה. */
  let seq=[], chars=0, guard=0;
  while(chars<170&&guard<8){items.forEach(n=>{seq.push(n);chars+=n.text.length;});guard++;}
  const one=seq.map(n=>`<span class="it-${n.k}"><span class="sep">${dateEn(n.t)}</span> ${n.text}</span>`)
    .join('<span class="sep">•</span>');
  f.innerHTML=one+'<span class="sep">•</span>'+one;
  f.style.animation='';
  f.style.animationDuration=clamp(20+chars*0.14,30,170)+'s';
}

    ${vals(S.cos).reduce((a,x)=>a.concat(x.products.filter(p=>p.state==='live').map(p=>({p,x}))),[])

/* ── מו"פ ──────────────────────────────────────────────────────────────── */
function vRnd(){
  const c=me();
  if(!c.alloc){c.alloc={};TK.forEach(k=>c.alloc[k]=1);const f=PARA[c.style.focus];if(f)for(const k in f.en)c.alloc[k]=2+f.en[k]*14;}
  const tot=sum(TK.map(k=>c.alloc[k]||0))||1;
  const rev12=sum(c.hist.slice(-12).map(h=>h.rev))||c.baseRev*12;
  const grp=g=>TK.filter(k=>TECH[k].g===g).map(k=>{
    const lvl=c.tech[k], fr=frontier(S,k), lead=lvl>=fr-0.5;
    const spend=c.rndBudget*((c.alloc[k]||0)/tot);
    const spec=c.staff.filter(s=>s.spec===k).length;
    return `<tr>
      <td style="min-width:150px"><b>${TECH[k].n}</b>${lead?' <span class="pill p-acc">מובילים</span>':''}
        ${spec?` <span class="pill p-vi">${spec} מומחים</span>`:''}
        <div class="meter ${lead?'':'c'}" style="margin-top:5px;max-width:150px"><span style="width:${lvl}%"></span></div></td>
      <td class="n">${rnd1(lvl,1)}</td>
      <td class="n ${lead?'up':'down'}">${lead?'—':'−'+rnd1(fr-lvl,1)}</td>
      <td style="min-width:120px"><input type="range" data-alloc="${k}" min="0" max="20" step="0.5" value="${c.alloc[k]||0}"></td>
      <td class="n sm-hide">${spend>0.005?'$'+rnd1(spend,2)+'B':'—'}</td></tr>`;}).join('');
  return `
  <div class="card">
    <header><h2>מו״פ וטכנולוגיה</h2><p>22 צמתי ידע · כאן נקבע אילו קטגוריות ייפתחו בעולם</p></header>
    <div class="cols c3" style="margin-bottom:14px">
      <div class="tile"><i>תקציב שנתי</i><b>$${rnd1(c.rndBudget,1)}B</b><small>${rnd1(c.rndBudget/rev12*100,1)}% מההכנסות</small></div>
      <div class="tile"><i>מכפיל צוות</i><b>×${rnd1(rndMult(c),2)}</b><small>${c.staff.length} אנשי מפתח</small></div>
      <div class="tile"><i>צמתים בהובלה</i><b>${TK.filter(k=>c.tech[k]>=frontier(S,k)-0.5).length}<span class="mut" style="font-size:13px">/${TK.length}</span></b><small>רק הובלה פותחת קטגוריה</small></div>
    </div>
    <label class="f"><span>תקציב מו״פ שנתי · <b class="num">$${rnd1(c.rndBudget,1)}B</b></span>
      <input type="range" id="rndB" min="${rnd1(Math.max(0.2,rev12*0.01),2)}" max="${rnd1(Math.max(2,rev12*0.30),1)}" step="0.1" value="${c.rndBudget}"></label>
    <p class="mut" style="font-size:12.5px">צומת בלי הקצאה נשחק מעצמו. צומת שמתחת לגבול העולמי מתקדם מהר — יש ממי ללמוד. צומת שבו אתם מובילים מתקדם לאט ויקר, אבל רק הובלה מזיזה את העולם.</p>
  </div>
  <div class="card"><header><h2>לאן ההקצאה דוחפת את העולם</h2></header>
    ${CH.bars(PK.map(p=>{const st=paraOf(p),pr=PARA[p];
      const push=sum(keys(pr.en).map(k=>(c.alloc[k]||0)/tot*pr.en[k]))*3.2;
      const mine=sum(keys(pr.en).map(k=>c.tech[k]*pr.en[k]));
      return {n:`${pr.n} <span class="mut" style="font-size:11.5px">· אצלנו <span class="num">${rnd1(mine,0)}</span> · בעולם <span class="num">${rnd1(st.ready,0)}</span> · סף <span class="num">${pr.viab}</span></span>`,
        v:clamp(push,0,1), lbl:push>0.5?'מיקוד ראשי':push>0.22?'השקעה משמעותית':push>0.06?'טפטוף':'אפס',
        c:mine>=st.ready-0.5?'':'c'};}))}
  </div>
  ${TGROUPS.map(g=>`<div class="card"><header><h2>${g}</h2></header>
    <div class="scroll"><table><thead><tr><th>צומת ידע</th><th class="n">אצלנו</th><th class="n">מול העולם</th><th>הקצאה</th><th class="n sm-hide">שנתי</th></tr></thead><tbody>${grp(g)}</tbody></table></div></div>`).join('')}`;
}

function vEco(){
  const c=me();
  const breadth=PK.filter(p=>c.products.some(x=>x.state==='live'&&x.para===p));

  const rivals=vals(S.cos).sort((a,b)=>(b.lockin||0)-(a.lockin||0));
  const risk=(()=>{ // כמה מהבסיס המותקן תלוי בקטגוריות שמאבדות גובה
    let w=0,t=0;
    c.products.filter(p=>p.state==='live').forEach(p=>{const u=p.lastUnits||0;t+=u;
      if(paraOf(p.para).declining)w+=u;});
    return t>0?w/t:0;})();
  return `
  <div class="card"><header><h2>אקוסיסטם ושירותים</h2><p>ההכנסה שממשיכה להגיע גם בחודש שבו לא מכרתם כלום</p></header>

        <div class="meter ${(c.lockin||0)>60?'g':(c.lockin||0)>35?'':'w'}" style="margin-top:6px"><span style="width:${c.lockin||0}%"></span></div>

      <div class="tile"><i>הכנסת שירותים</i><b>${B(c.services||0)}</b><small>${rnd1((c.services||0)/Math.max(0.01,c.rev||1)*100,0)}% מסך ההכנסות · שוליים 68%</small></div>
    </div>
  </div>
  <div class="cols c2">
    <div class="card"><header><h2>ממה מורכבת הנעילה</h2></header>
      ${CH.bars([
        {n:'טכנולוגיית פלטפורמה, חנות ושירותים',v:(c.tech.platform||0)/100,lbl:rnd1(c.tech.platform||0,0)+' מתוך 100',c:'v'},
        {n:'רוחב האקוסיסטם',v:breadth.length/PK.length,lbl:breadth.length+' קטגוריות פעילות',c:'c'},
        {n:'נתח שוק',v:clamp((c.share||0)*3,0,1),lbl:rnd1((c.share||0)*100,1)+'%'},
        {n:'תלות בקטגוריות דועכות',v:risk,lbl:rnd1(risk*100,0)+'% מהמכירות',c:risk>0.5?'b':risk>0.25?'w':'g'}])}
      <p class="mut" style="font-size:12.5px;margin-top:10px">נעילה גבוהה מוסיפה עד 17% לאטרקטיביות של כל מוצר שלכם — אבל כשהעולם עובר קטגוריה, בסיס מותקן גדול בקטגוריה הישנה הופך מנכס לעוגן.</p>

    ${rivals.map(x=>`<tr class="${x.id===S.me?'me':''}"><td><b>${esc(x.n)}</b></td>

let MODAL_CLOSE=null;
function modal(html,cls,onClose){
  const m=$('modal');
  MODAL_CLOSE=onClose===undefined?dismiss:onClose;
  try{
    m.hidden=false;
    m.innerHTML=`<div class="modal ${cls||''}">${html}</div>`;
    m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{closeModal();next();});
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(MODAL_CLOSE)MODAL_CLOSE();else{closeModal();render();}});
  }catch(err){
    /* גלגל הצלה: אם חלון נכשל ברינדור, אסור שהמשחק יינעל */
    m.hidden=false;
    m.innerHTML='<div class="modal"><div class="top"><h3>שגיאה בהצגת החלון</h3></div>'+
      '<div class="bd"><p>משהו השתבש בהצגת החלון הזה. המשחק ממשיך כרגיל.</p></div>'+
      '<div class="ft"><button class="btn pri" data-close>סגירה</button></div></div>';
    m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{closeModal();next();});
  }
  return m;
}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML='';MODAL_CLOSE=null;}
/* סגירה כללית — גם בלחיצה על הרקע, כי בטלפון אין Escape */
function dismiss(){closeModal();next();}
$('modal').addEventListener('click',e=>{if(e.target&&e.target.id==='modal'){if(MODAL_CLOSE)MODAL_CLOSE();else dismiss();}});
function next(){ if(Q.length){const f=Q.shift();f();} else {render();save();} }

function newProdModal(){
  const c=me();
  const firstOpen=PK.find(p=>paraOf(p).open)||'phone';
  let cfg={para:firstOpen,name:'',price:PARA[firstOpen].price,mkt:0.02*Math.max(0.3,c.baseRev),
           lead:PARA[firstOpen].dev,keynote:1,parts:defCfg(firstOpen,3)};
  const probe=()=>({para:cfg.para,name:cfg.name,price:cfg.price,cfg:cfg.parts,mkt:cfg.mkt,
                    start:S.t,launch:S.t+cfg.lead,sabotage:0,defect:false,keynote:cfg.keynote});
  const bestIn=para=>{let b=0;for(const id in S.cos)S.cos[id].products.forEach(x=>{
    if(x.state==='live'&&x.para===para&&x.score>b)b=x.score;});return b;};
  const set=(id,txt,cls)=>{const e=$(id);if(!e)return;if(txt!==undefined)e.innerHTML=txt;
    if(cls!==undefined)e.className=cls;};

  /* מעדכן רק את המספרים — בלי לבנות מחדש את החלון, כדי שכלום לא יקפוץ */
  const sync=()=>{
    const pr=PARA[cfg.para], pb=probe();
    const score=scoreOf(S,c,pb), bom=bomOf(S,c,pb), marg=1-bom/cfg.price;
    const risk=Math.pow(clamp(1-cfg.lead/pr.dev,0,1),1.5)*0.8;
    const best=bestIn(cfg.para);
    set('lLead',`<b>${dateHe(S.t+cfg.lead)}</b> · <span class="num">${cfg.lead}</span> מתוך <span class="num">${pr.dev}</span> חודשי פיתוח`);
    set('lPrice',`<b class="num">$${cfg.price}</b>`);
    set('lMkt',`<b class="num">$${Math.round(cfg.mkt*1000)}M</b> לחודש`);
    set('lKey',`<b>${KEYNOTE[cfg.keynote].n}</b> · עלות ${B(keynoteCost(c,cfg.keynote))}`);
    modsOf(cfg.para).forEach(k=>{
      const t=cfg.parts[k];
      set('tb-'+k,PARTS[k].t[t-1],'pill '+(t>=4?'p-acc':t===3?'p-mut':'p-warn'));
      set('tc-'+k,`עלות ×${rnd1(TIER_COST[t-1],2)}`);
      const lvl=c.tech[PARTS[k].node]||0;
      set('tw-'+k, lvl>72&&t<=2?'הידע שלכם בתחום מבוזבז בדרגה הזאת':'');
    });
    set('sScore',Math.round(score),!best||score>=best?'up':score>best*0.9?'':'down');
    set('sScoreSub',(!best?'ראשון בקטגוריה':score>=best?'מוביל בקטגוריה':score>best*0.92?'תחרותי':'מאחור')
      +(best?' · הטוב בשוק '+Math.round(best):''));
    set('sBom','$'+Math.round(bom));
    set('sMarg',rnd1(marg*100,0)+'%',marg>0.4?'up':marg>0.2?'':'down');
    set('sMargSub','$'+Math.round(cfg.price-bom)+' ליחידה');
    set('sRisk',rnd1(risk*100,0)+'%',risk<0.05?'up':risk<0.2?'':'down');
    set('sRiskSub',risk>0.25?'הפיתוח לא יבשיל':risk>0.05?'סיכון מנוהל':'יספיק להבשיל');
    const cl=$('pClosed'); if(cl)cl.style.display=paraOf(cfg.para).open?'none':'';
    set('pNote',`עלות פיתוח ${B(pr.nre)} (40% עכשיו) · אירוע חשיפה ${B(keynoteCost(c,cfg.keynote))} בהשקה · מזומן זמין ${B(c.cash)}.`);
  };

  const build=()=>{
    const pr=PARA[cfg.para], st=paraOf(cfg.para);
    modal(`<div class="top"><h3>מגדיר המכשיר</h3>
        <span class="pill p-mut right" style="background:${PC[cfg.para]}22;color:${PC[cfg.para]}">${esc(pr.n)}</span>

          <label class="f"><span>שם מסחרי</span><input type="text" id="pName" value="${esc(cfg.name)}" placeholder="${esc(c.tag+' '+pr.short)}"></label>
          <label class="f"><span>מועד השקה · <span id="lLead"></span></span>

          <label class="f"><span>שיווק · <span id="lMkt"></span></span>
            <input type="range" id="pMkt" min="0" max="${rnd1(Math.max(0.1,c.baseRev*0.09),2)}" step="0.005" value="${cfg.mkt}"></label>
          <label class="f"><span>אירוע חשיפה · <span id="lKey"></span></span>
            <div class="seg" id="pKey">${KEYNOTE.map((k,i)=>`<button data-k="${i}" class="${i===cfg.keynote?'on':''}">${k.n}</button>`).join('')}</div></label>

      </div>
      <p class="pill p-bad" id="pClosed" style="display:${st.open?'none':''};padding:9px 12px;font-family:var(--body);font-weight:600;line-height:1.5">

        <div class="cols c3">

      np.launch=S.t+cfg.lead; c.products.push(np); c.cash-=q.nre*0.4;

  };
  build();
}

function negotiateModal(id){
  const cand=S.talent.find(t=>t.id===id); if(!cand)return;
  const c=me();
  let offer={salary:Math.round(cand.ask*0.95),equity:false,title:false}, msg=null, ok=false;
  const draw=()=>{
    modal(`<div class="top"><h3>משא ומתן · ${esc(cand.name)}</h3><button class="x" data-x>×</button></div>
      <div class="bd">
        <div class="cols c2" style="margin-bottom:14px">
          <div class="tile"><i>${ROLES[cand.role].n}</i><b style="font-size:15px;font-family:var(--display)">${TECH[cand.spec].n}</b>
            <small>יצירתיות ${cand.creativity} · יעילות ${cand.efficiency} · מנהיגות ${cand.leadership}</small></div>
          <div class="tile"><i>סבלנות</i><b class="${cand.patience>60?'up':cand.patience>30?'':'down'}">${Math.round(cand.patience)}%</b>
            <div class="meter ${cand.patience>60?'g':cand.patience>30?'w':'b'}" style="margin-top:6px"><span style="width:${cand.patience}%"></span></div>
            <small>${cand.rounds} סבבים · דרישה מוצהרת $${cand.ask}M</small></div>
        </div>
        ${msg?`<div class="tile" style="margin-bottom:12px;border-color:${ok?'var(--good)':'var(--warn)'}"><i>תגובה</i>
          <div style="font-size:14px;margin-top:4px;color:var(--ink)">${msg}</div></div>`:''}
        <label class="f"><span>שכר שנתי לחבילה · <b class="num">$${offer.salary}M</b></span>
          <input type="range" id="nSal" min="${Math.round(cand.ask*0.4)}" max="${Math.round(cand.ask*2.1)}" step="5" value="${offer.salary}"></label>
        <div class="row" style="gap:16px">
          <label class="row" style="gap:6px;font-size:13.5px"><input type="checkbox" id="nEq" ${offer.equity?'checked':''}> אקוויטי חסום</label>
          <label class="row" style="gap:6px;font-size:13.5px"><input type="checkbox" id="nTi" ${offer.title?'checked':''}> תואר בכיר</label>
        </div>
        <p class="mut" style="font-size:12.5px;margin-top:10px">אקוויטי מוריד את הדרישה וגם מקשה על יריבים לחטוף. כל הצעה נמוכה מדי שורפת סבלנות — וכשהיא נגמרת, המועמד הולך.</p>
      </div>
      <div class="ft"><button class="btn" data-x>יציאה</button><button class="btn pri" id="nGo">הגשת הצעה</button></div>`);
    $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
    $('nSal').oninput=e=>{offer.salary=+e.target.value;
      e.target.parentNode.querySelector('b').textContent='$'+offer.salary+'M';};
    $('nEq').onchange=e=>{offer.equity=e.target.checked;};
    $('nTi').onchange=e=>{offer.title=e.target.checked;};
    $('nGo').onclick=()=>{
      if(c.cash<offer.salary/1000*2){alert('אין מספיק מזומן לחבילה הזאת.');return;}
      const r=evaluateOffer(S,cand,offer);
      if(r.accept){
        if(offer.equity)cand.equity=true;
        cand.ask=offer.salary; hireTo(S,c,cand);
        news(S,`<b>${cand.name}</b> מצטרף/ת אלינו כ${ROLES[cand.role].n} בתחום ${TECH[cand.spec].n}.`,'g');
        closeModal(); render(); save();
      } else if(r.walked){
        S.talent=S.talent.filter(t=>t!==cand);
        news(S,`${cand.name} סיים/ה את המשא ומתן איתנו. ההצעות לא היו רציניות מספיק.`,'w');
        closeModal(); render(); save();
      } else {
        msg=`"זה לא מספיק. אני מחפש/ת משהו באזור <b class='num'>$${r.counter}M</b>."`;
        offer.salary=r.counter; draw();
      }
    };
  };
  draw();
}

function contractModal(comp){
  const c=me();
  let months=12, share=50;
  const draw=()=>{
    const sup=S.suppliers.filter(s=>s.cov.indexOf(comp)>=0).reduce((a,b)=>a.prem<b.prem?a:b);
    const price=S.spot[comp]*(1+sup.prem+months*0.004);
    modal(`<div class="top"><h3>חוזה אספקה · ${COMP[comp].n}</h3><button class="x" data-x>×</button></div>
      <div class="bd">
        <div class="cols c2" style="margin-bottom:12px">
          <div class="tile"><i>מחיר שוק כרגע</i><b>×${rnd1(S.spot[comp],2)}</b></div>
          <div class="tile hi"><i>מחיר נעול בחוזה</i><b>×${rnd1(price,2)}</b><small>ספק: ${esc(sup.n)} · ${sup.geo}</small></div>
        </div>
        <label class="f"><span>אורך החוזה · <b>${months} חודשים</b></span><input type="range" id="cM" min="6" max="30" step="3" value="${months}"></label>
        <label class="f"><span>נפח מחויב · <b>${share}%</b> מהצריכה הנוכחית</span><input type="range" id="cV" min="20" max="100" step="10" value="${share}"></label>
        <p class="mut" style="font-size:12.5px">חוזה ארוך יקר יותר אבל מגן יותר. take-or-pay: תשלמו על 70% מהנפח גם בחודשים שבהם תייצרו פחות.</p>
      </div>
      <div class="ft"><button class="btn" data-x>ביטול</button><button class="btn pri" id="cGo">חתימה</button></div>`);
    $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
    $('cM').oninput=e=>{months=+e.target.value;draw();};
    $('cV').oninput=e=>{share=+e.target.value;draw();};
    $('cGo').onclick=()=>{
      const need=sum(c.products.filter(p=>p.state==='live').map(p=>(recipeOf(p.para)[comp]||0)*(p.lastUnits||0)))/1000;
      signContract(S,c,comp,months,Math.max(0.02,need*share/100));
      news(S,`נחתם חוזה ל${COMP[comp].n} ל-${months} חודשים במחיר נעול ×${rnd1(price,2)}.`,'a');
      closeModal(); render(); save();
    };
  };
  draw();
}
