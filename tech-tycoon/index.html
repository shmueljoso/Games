function wire(){
  const v=$('view'), c=me()||{products:[],alloc:{}};
  const rb=$('rndB'); if(rb)rb.oninput=e=>{c.rndBudget=+e.target.value;render();};
  v.querySelectorAll('[data-alloc]').forEach(i=>i.oninput=()=>{c.alloc[i.dataset.alloc]=+i.value;render();});
  v.querySelectorAll('[data-price]').forEach(i=>i.onchange=()=>{const p=c.products.find(x=>x.id===+i.dataset.price);if(p)p.price=clamp(Math.round(+i.value||p.price),40,9000);render();});
  v.querySelectorAll('[data-mkt]').forEach(i=>i.oninput=()=>{const p=c.products.find(x=>x.id===+i.dataset.mkt);if(p)p.mkt=+i.value;render();});
  const ot=$('opsTarget'); if(ot)ot.onchange=e=>{S.ops.target=e.target.value;render();};
  [['opEsp','esp'],['opSab','sab'],['opHype','hype'],['opCin','cin']].forEach(a=>{
    const el=$(a[0]); if(el)el.oninput=()=>{S.ops[a[1]]=+el.value;render();};});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset));
  v.querySelectorAll('[data-cact]').forEach(b=>b.onclick=()=>act('cact',{k:b.dataset.cact}));
}
function pickReviewModal(pid){
  let prod=null,co=null;
  for(const id in S.cos)S.cos[id].products.forEach(x=>{if(x.id===+pid){prod=x;co=S.cos[id];}});
  if(!prod){reviewPickerModal();return;}
  let score=6.5;
  let best=0; for(const id in S.cos)S.cos[id].products.forEach(x=>{
    if(x.state==='live'&&x.para===prod.para&&x.score>best)best=x.score;});
  const draw=()=>{
    modal(`<div class="top"><h3>ביקורת · ${esc(prod.name)}</h3><button class="x" data-x>×</button></div>
      <div class="bd">
        <div class="cols c2" style="margin-bottom:12px">
          <div class="tile"><i>${esc(co.n)} · ${PARA[prod.para].n}</i>
            <b style="font-size:16px;font-family:var(--display)">מפרט ${Math.round(prod.score)}</b>
            <small>הטוב בקטגוריה כרגע: ${Math.round(best)}</small></div>
          <div class="tile"><i>מחיר</i><b style="font-size:16px">$${prod.price}</b>
            <small>מחיר ייחוס בקטגוריה $${PARA[prod.para].price}</small></div>
        </div>
        <p class="mut" style="font-size:12.5px">אף אחד לא יגיד לכם מה הציון ה"נכון". תשקללו מפרט מול המוביל בקטגוריה,
        ומול מה שהמכשיר מבקש בכסף. ככל שתתקרבו לאמת — האמינות תעלה, וההשפעה שלכם תגדל.</p>
        <label class="f" style="margin-top:14px"><span>הציון שלכם · <b class="num" id="rvLbl">${score}</b> מתוך 10</span>
          <input type="range" id="rvScore" min="1" max="10" step="0.1" value="${score}"></label>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${[3,5,6.5,8,9.5].map(v=>`<button class="btn sm" data-q="${v}">${v}</button>`).join('')}
        </div>
        ${prod.review?`<p class="mut" style="font-size:12.5px;margin-top:12px">ממוצע הביקורות הנוכחי: <b class="num">${prod.review}/10</b>. לצאת נגד הקונצנזוס זה מסוכן — ומשתלם כשצודקים.</p>`:''}
      </div>
      <div class="ft"><button class="btn" data-x>ביטול</button><button class="btn pri" id="rvGo">לפרסם את הביקורת</button></div>`);
    $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
    $('rvScore').oninput=e=>{score=+e.target.value;$('rvLbl').textContent=score;};
    $('modal').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{score=+b.dataset.q;
      $('rvScore').value=score;$('rvLbl').textContent=score;});
    $('rvGo').onclick=()=>{
      S.creator.action={type:'review',pid:prod.id,score:Math.round(score*10)/10,pname:prod.name};
      closeModal();V='creator';drawRail();render();save();};
  };
  draw();
}
function reviewPickerModal(){
  const prods=[];
  for(const id in S.cos)S.cos[id].products.forEach(p=>{if(p.state==='live')prods.push({p,co:S.cos[id]});});
  prods.sort((a,b)=>(b.p.lastRev||0)-(a.p.lastRev||0));
  modal(`<div class="top"><h3>איזה מכשיר לסקר</h3><button class="x" data-x>×</button></div>
    <div class="bd">${prods.slice(0,16).map(o=>`<button class="choice" data-pick="${o.p.id}">
      <b>${esc(o.p.name)} <span class="mut" style="font-weight:400">· ${esc(o.co.n)}</span></b>
      <span>${PARA[o.p.para].n} · מפרט ${Math.round(o.p.score)} · $${o.p.price}${o.p.review?' · ביקורות '+o.p.review:''}</span></button>`).join('')
      ||'<p class="mut">אין כרגע מכשירים בשוק.</p>'}</div>`);
  $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
  $('modal').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickReviewModal(b.dataset.pick));
}
function pickCoModal(kind){
  const ids=keys(S.cos).filter(id=>S.cos[id].baseRev>0.2);
  modal(`<div class="top"><h3>${kind==='invest'?'על מי לעשות תחקיר':'עם מי לעשות סרטון ממומן'}</h3>
      <button class="x" data-x>×</button></div>
    <div class="bd">${ids.map(id=>{const t=S.cos[id];
      return `<button class="choice" data-pickco="${id}"><b>${esc(t.n)}</b>
        <span>הכנסה ${B(t.rev||t.baseRev)}/ח׳ · מותג ${Math.round(t.brand)}${t.scandal?' · עבר בעייתי':''}</span></button>`;}).join('')}</div>`);
  $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
  $('modal').querySelectorAll('[data-pickco]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pickco;
    S.creator.action={type:kind,co:id,coname:S.cos[id].n};
    closeModal();V='creator';drawRail();render();save();});
}
function foundModal(){
  const C=S.creator;
  let cfg={name:C.name.split(' ')[0]+' Devices',tag:'',focus:PK.find(p=>paraOf(p).open)||'phone',trait:'reach'};
  const traits=[['reach','הפצה ישירה לקהל'],['multibrand','ריבוי מותגים'],['costEff','הנדסה לעלות'],['carrier','קשרי ערוצי מכירה']];
  const draw=()=>{
    const seed=clamp(C.f*0.32+C.cred*0.02,0.4,6);
    modal(`<div class="top"><h3>הקמת חברה</h3><button class="x" data-x>×</button></div>
      <div class="bd">
        <label class="f"><span>שם החברה</span><input type="text" id="fName" value="${esc(cfg.name)}" maxlength="24"></label>
        <label class="f"><span>סימול (3 אותיות)</span><input type="text" id="fTag" value="${esc(cfg.tag)}" placeholder="${esc(cfg.name.slice(0,3).toUpperCase())}" maxlength="4"></label>
        <label class="f"><span>קטגוריית ליבה — שם הידע שלכם יתחיל גבוה</span>
          <select id="fFocus">${PK.map(p=>`<option value="${p}" ${p===cfg.focus?'selected':''}>${PARA[p].n}${paraOf(p).open?'':' — סגורה'}</option>`).join('')}</select></label>
        <label class="f"><span>יתרון מבני</span>
          <div class="seg" id="fTrait">${traits.map(t=>`<button data-t="${t[0]}" class="${cfg.trait===t[0]?'on':''}">${t[1]}</button>`).join('')}</div></label>
        <div class="cols c3">
          <div class="tile hi"><i>גיוס</i><b>${B(seed)}</b></div>
          <div class="tile"><i>מותג התחלתי</i><b>${Math.round(clamp(26+C.f*1.5+C.cred*0.12,20,72))}</b></div>
          <div class="tile"><i>בסיס מותקן</i><b>${Math.round(clamp(C.f*8,2,400))}M</b></div>
        </div>
        <p class="mut" style="font-size:12.5px;margin-top:10px">הקהל עובר איתכם: מותג גבוה מהרגיל לחברה חדשה, ומכשיר ראשון נכנס לפיתוח מיד.
        מהרגע הזה אתם בצד השני — והיוצרים יסקרו אתכם.</p>
      </div>
      <div class="ft"><button class="btn" data-x>עוד לא</button><button class="btn pri" id="fGo">להקים</button></div>`);
    $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{closeModal();render();});
    $('fName').oninput=e=>{cfg.name=e.target.value;};
    $('fTag').oninput=e=>{cfg.tag=e.target.value.toUpperCase();};
    $('fFocus').onchange=e=>{cfg.focus=e.target.value;};
    $('fTrait').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cfg.trait=b.dataset.t;
      $('fTrait').querySelectorAll('[data-t]').forEach(x=>x.className=(x.dataset.t===cfg.trait?'on':''));});
    $('fGo').onclick=()=>{
      if(!cfg.name.trim())return alert('צריך שם לחברה.');
      cfg.tag=(cfg.tag||cfg.name.slice(0,3)).toUpperCase().slice(0,4);
      foundCompany(S,cfg);
      closeModal();V='dash';drawRail();render();save();
      modal(`<div class="top"><h3>${esc(cfg.name)} יוצאת לדרך</h3></div>
        <div class="bd"><p style="color:var(--ink);font-size:15px">הקהל שבניתם הפך להון. מהיום אתם מנהלים חברה —
        עם דירקטוריון, מתחרים, ויוצרי תוכן שיסקרו כל מכשיר שתוציאו.</p>
        <p class="mut">המכשיר הראשון כבר בפיתוח. אפשר לשנות אותו במסך המוצרים.</p></div>
        <div class="ft"><button class="btn pri" data-close>קדימה</button></div>`);
    };
  };
  draw();
}
function act(a,d){
  const c=me();
  if(a==='cact'){
    const k=d.k;
    if(k==='review')reviewPickerModal();
    else if(k==='invest'||k==='sponsor')pickCoModal(k);
    else {S.creator.action={type:k};render();save();}
  }
  else if(a==='rev')pickReviewModal(d.id);
  else if(a==='takeoffer'){
    const o=S.creator.offers[+d.i];
    if(o){S.creator.action={type:'sponsor',co:o.co,coname:S.cos[o.co]?S.cos[o.co].n:''};
      S.creator.offers.splice(+d.i,1);V='creator';drawRail();render();save();}
  }
  else if(a==='found')foundModal();
  else if(a==='newprod')newProdModal();
  else if(a==='install')doInstall();
  else if(a==='save')saveModal();
  else if(a==='goto'){V=d.v;drawRail();render();}
  else if(a==='shift'){const p=c.products.find(x=>x.id===+d.id);const n=+d.d;
    if(p&&p.launch+n>S.t){p.launch+=n;render();}}
  else if(a==='kill'){const p=c.products.find(x=>x.id===+d.id);
    if(p&&confirm('לבטל את '+p.name+'? ההוצאה שכבר בוצעה לא תוחזר.')){c.products=c.products.filter(x=>x!==p);render();}}
  else if(a==='negotiate')negotiateModal(+d.id);
  else if(a==='fire'){const s=c.staff.find(x=>x.id===+d.id);
    if(s&&confirm('לשחרר את '+s.name+'?')){c.staff=c.staff.filter(x=>x!==s);c.allocCache=null;render();}}
  else if(a==='buy'){const s=S.startups.find(x=>x.id===+d.id);
    if(s&&c.cash>s.price){acquire(S,c,s);news(S,`רכשנו את <b>${s.n}</b> תמורת $${s.price}B.`,'a');render();save();}}
  else if(a==='buyco'){const t=S.cos[d.id];
    if(t&&confirm('להגיש הצעת רכישה ל'+t.n+' תמורת $'+companyValue(S,t)+'B?')){acquireCompany(S,c,t);render();save();}}
  else if(a==='contract')contractModal(d.c);
  else if(a==='offer'){const o=S.career.offers[+d.i];
    if(o&&S.cos[o.co]&&confirm('לעבור לנהל את '+S.cos[o.co].n+'?')){takeOffer(S,o);V='dash';drawRail();render();save();}}
  else if(a==='restart'){if(confirm('להתחיל משחק חדש? המצב הנוכחי יימחק.')){localStorage.removeItem(SAVE);location.reload();}}
}

/* ── תור ───────────────────────────────────────────────────────────────── */
function endTurn(){
  if(!S||S.over)return;
  S.spotHist=S.spotHist||[]; S.spotHist.push(Object.assign({},S.spot)); if(S.spotHist.length>40)S.spotHist.shift();
  const r=step(S);
  Q=[];
  if(r.event)Q.push(()=>eventModal(r.event));
  if(r.end){
    if(r.end.kind==='fired')Q.push(()=>firedModal(r.end));
    else {S.over=true;Q.push(()=>overModal(r.end));}
  }
  render();
  next();
}
$('ticker').onclick=()=>{V='log';drawRail();render();};
$('ticker').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();V='log';drawRail();render();}};
$('nextBtn').onclick=endTurn;
$('nextBtn2').onclick=endTurn;
$('saveBtn').onclick=()=>saveModal();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('modal').hidden){if(MODAL_CLOSE)MODAL_CLOSE();else dismiss();}
  if(e.key==='Enter'&&$('modal').hidden&&S&&!S.over&&document.activeElement.tagName!=='INPUT')endTurn();
});
/* ── התקנה כאפליקציה ───────────────────────────────────────────────────── */
let INSTALL_EVT=null;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;paintInstall();});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;paintInstall();});
function canInstall(){return !isStandalone();}
function paintInstall(){
  document.querySelectorAll('[data-install]').forEach(b=>{b.style.display=canInstall()?'':'none';});
}
function doInstall(){
  if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;paintInstall();});return;}
  modal(`<div class="top"><h3>התקנה על הטלפון</h3><button class="x" data-x>×</button></div>
    <div class="bd">
      <p>אפשר להוסיף את המשחק למסך הבית ולהפעיל אותו כמו אפליקציה — במסך מלא, בלי שורת כתובת, וגם בלי חיבור לאינטרנט.</p>
      ${isIOS()?`<div class="tile"><i>ספארי · אייפון ואייפד</i>
        <div style="margin-top:6px;font-size:14px;line-height:1.9">1. לחיצה על כפתור <b>שיתוף</b> (הריבוע עם החץ)<br>
        2. גלילה ובחירה ב־<b>הוספה למסך הבית</b><br>3. אישור</div></div>`:
       `<div class="tile"><i>כרום · אנדרואיד</i>
        <div style="margin-top:6px;font-size:14px;line-height:1.9">1. תפריט שלוש הנקודות בפינה<br>
        2. <b>התקנת אפליקציה</b> או <b>הוספה למסך הבית</b></div></div>`}
      <p class="mut" style="font-size:12.5px;margin-top:12px">ההתקנה עובדת כשהמשחק נפתח מכתובת אינטרנט. אם פתחתם קובץ מקומי, הדפדפן לא יציע התקנה.</p>
    </div>
    <div class="ft"><button class="btn pri" data-x>הבנתי</button></div>`);
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
drawIntro();
/* UI_END */
</script>
